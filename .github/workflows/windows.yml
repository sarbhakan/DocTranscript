name: Windows — construction et recette
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 40
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Vérifier le banc et le lexique
        run: |
          python -m unittest discover -s p0/bench -t . -p "test_*.py"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m unittest discover -s lexique -p "test_*.py"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Tester stockage chiffré, migrations, sous-dossiers et récupération
        run: python -m app.test_windows --compiler msvc --output "$env:RUNNER_TEMP/NoteVive-unit-tests"
      - name: Préparer les entrées officielles et vérifier leurs empreintes
        run: python app/prepare_windows.py
      - name: Compiler Whisper CPU sans redistribuable externe
        run: python app/build_whisper_windows.py --toolset clangcl --source app/private/downloads/whisper-v1.8.5-source.tar.gz --openblas-source app/private/downloads/openblas-v0.3.34-source.tar.gz --output app/private/whisper-build
      - name: Compiler le paquet autonome
        run: python app/build_windows.py --zig app/private/toolchain/zig-x86_64-windows-0.15.2/zig.exe
      - name: Extraire le ZIP livré
        id: unzip
        run: Expand-Archive dist/NoteVive-Windows-x64-Essai.zip "$env:RUNNER_TEMP/NoteVive-paquet"
      - name: Tester le moteur du ZIP, les doses et les fractions en AVX2
        run: |
          Get-CimInstance Win32_Processor | Select-Object Name, NumberOfCores, NumberOfLogicalProcessors | Format-List
          Get-CimInstance Win32_ComputerSystem | Select-Object TotalPhysicalMemory | Format-List
          python -m app.test_windows --compiler msvc --engine-only --output "$env:RUNNER_TEMP/NoteVive-engine-tests" --package "$env:RUNNER_TEMP/NoteVive-paquet/NoteVive"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Tester la fenêtre et le parcours des notes sans micro
        if: ${{ !cancelled() && steps.unzip.outcome == 'success' }}
        shell: powershell
        run: ./app/windows/ui_smoke.ps1 -Executable "$env:RUNNER_TEMP/NoteVive-paquet/NoteVive/NoteVive.exe"
      - name: Comparer CTranslate2 INT8 sur le même hôte Windows
        if: ${{ !cancelled() }}
        run: |
          Get-CimInstance Win32_Processor | Select-Object Name, NumberOfCores, NumberOfLogicalProcessors | Format-List
          $py = "$env:RUNNER_TEMP/ct2-venv/Scripts/python.exe"
          python -m venv "$env:RUNNER_TEMP/ct2-venv"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & $py -m pip --isolated install --index-url https://pypi.org/simple --disable-pip-version-check --require-hashes --only-binary ':all:' -r p0/packs/ct2-cp312-win-amd64.lock.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & $py -m pip check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m p0.windows.ct2_probe fetch --model "$env:RUNNER_TEMP/ct2-turbo"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          foreach ($threads in @(4, 2)) {
            python -m p0.windows.measure --output "$env:RUNNER_TEMP/ct2-memory-$threads.json" -- $py -m p0.windows.ct2_probe run --model "$env:RUNNER_TEMP/ct2-turbo" --threads $threads --output "$env:RUNNER_TEMP/ct2-metrics-$threads.json"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            $resources = Get-Content "$env:RUNNER_TEMP/ct2-memory-$threads.json" -Raw | ConvertFrom-Json
            $resources | Select-Object interval_ms_requested, peak_sampled_private_bytes, observed_cpu_seconds, observed_mean_cpu_core_equivalents, snapshot_errors, partial_samples, exit_code | ConvertTo-Json -Compress
          }
      - name: Conserver les mesures agrégées sans audio ni transcription
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Mesures-Windows
          path: |
            ${{ runner.temp }}/NoteVive-engine-tests/timings.json
            ${{ runner.temp }}/ct2-metrics-*.json
            ${{ runner.temp }}/ct2-memory-*.json
          retention-days: 30
          if-no-files-found: warn
      - name: Publier le paquet de recette
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: NoteVive-Windows-x64-Essai
          path: |
            dist/NoteVive-Windows-x64-Essai.zip
            dist/NoteVive-Windows-x64-Essai.zip.sha256
          retention-days: 30
          if-no-files-found: error
  release:
    needs: windows
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release 0.3.0]')
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: NoteVive-Windows-x64-Essai
          path: dist
      - name: Vérifier le ZIP puis publier la préversion autorisée
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          $archive = 'dist/NoteVive-Windows-x64-Essai.zip'
          $expected = (Get-Content "$archive.sha256").Split(' ')[0]
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'ZIP altéré' }
          gh release create v0.3.0-essai --target "$env:RELEASE_COMMIT" --prerelease --latest=false --title "NoteVive 0.3.0 — essai Windows hors ligne" --notes-file app/RELEASE-0.3.0.md $archive "$archive.sha256"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
