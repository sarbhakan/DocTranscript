name: Windows — construction et recette
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Vérifier le banc et le lexique
        run: |
          python -m unittest discover -s p0/bench -t . -p "test_*.py"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m unittest discover -s lexique -p "test_*.py"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Préparer les entrées officielles et vérifier leurs empreintes
        run: python app/prepare_windows.py
      - name: Compiler Whisper CPU sans redistribuable externe
        run: python app/build_whisper_windows.py --source app/private/downloads/whisper-v1.8.5-source.tar.gz --output app/private/whisper-build
      - name: Compiler le paquet autonome
        run: python app/build_windows.py --zig app/private/toolchain/zig-x86_64-windows-0.15.2/zig.exe
      - name: Extraire le ZIP livré
        run: Expand-Archive dist/NoteVive-Windows-x64-Essai.zip "$env:RUNNER_TEMP/NoteVive-paquet"
      - name: Tester stockage chiffré, migrations, sous-dossiers, crash et moteur
        run: python -m app.test_windows --zig app/private/toolchain/zig-x86_64-windows-0.15.2/zig.exe --output "$env:RUNNER_TEMP/NoteVive-tests" --package "$env:RUNNER_TEMP/NoteVive-paquet/NoteVive"
      - name: Tester la fenêtre et le parcours des notes sans micro
        shell: powershell
        run: ./app/windows/ui_smoke.ps1 -Executable "$env:RUNNER_TEMP/NoteVive-paquet/NoteVive/NoteVive.exe"
      - name: Publier le paquet de recette
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: NoteVive-Windows-x64-Essai
          path: |
            dist/NoteVive-Windows-x64-Essai.zip
            dist/NoteVive-Windows-x64-Essai.zip.sha256
          retention-days: 30
          if-no-files-found: error
